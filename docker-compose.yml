version: "3.9"

services:
  # Redis：云架构多实例共享（任务锁/提醒去重/调度抢占/队列）
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes

  # PostgreSQL（可选）：云架构多实例高并发数据层；不启用时 backend 用 SQLite
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiagent
      POSTGRES_PASSWORD: aiagent
      POSTGRES_DB: aiagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - backend

  # 分享服务：web/ 产物静态托管（与 API 不同源，防同源 XSS）
  assets:
    image: python:3.11-slim
    command: python -m http.server 8001 --directory /web
    ports:
      - "8001:8001"
    volumes:
      - ./web:/web:ro
    restart: unless-stopped

volumes:
  pgdata:
