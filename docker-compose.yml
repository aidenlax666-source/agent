version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - backend

  # 分享服务：web/ 产物静态托管（与 API 不同源，防同源 XSS）
  assets:
    image: python:3.11-slim
    command: python -m http.server 8001 --directory /web
    ports:
      - "8001:8001"
    volumes:
      - ./web:/web:ro
    restart: unless-stopped
