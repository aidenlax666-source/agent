# ============================================================
# 云部署反向代理（Nginx + HTTPS）
#
# 用法：
#   1. 把 your-domain.com 换成你的域名（两处 server_name + 证书路径）
#   2. 首次签发证书（服务器上）：
#        sudo certbot certonly --nginx -d your-domain.com
#   3. 把本文件放到 /etc/nginx/sites-available/ 并软链到 sites-enabled/
#   4. 测试并重载：sudo nginx -t && sudo systemctl reload nginx
#
# 架构：
#   客户端 → Nginx(443 TLS) → API(8000) / 前端(3000) / 产物静态(8001)
#   静态资源加长缓存；产物带 X-Content-Type-Options: nosniff
# ============================================================

# ---------- HTTP → HTTPS 跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Let's Encrypt 验证目录（certbot 自动写入）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 主站 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    # 证书（certbot 签发后自动指向这里）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # TLS 加固
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 客户端体大小上限（上传文件）
    client_max_body_size 50m;

    # ---------- 前端（Next.js :3000）----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";  # WebSocket（联机游戏/流式）
        proxy_read_timeout 300s;
    }

    # ---------- API（:8000）----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---------- 产物静态（:8001，视频/图片/游戏/报告）----------
    location /assets/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;

        # 大文件（视频/音频）可流式；产物 HTML 带 nosniff 防内联 XSS
        add_header X-Content-Type-Options nosniff always;

        # 缓存策略：
        # - 产物文件名带随机后缀（task_id），可长缓存
        # - 视频/音频支持 Range（边下边播）
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
